<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Geldim / Çıktım · Aysu Halı Saha</title>
<meta name="theme-color" content="#062a45">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #062a45; color: #10202d;
    font: 400 17px/1.45 system-ui, sans-serif; padding: 20px; }
  .kart { background: #fff; border-radius: 18px; padding: 26px 20px; width: 100%; max-width: 380px; text-align: center; }
  img { width: 130px; margin-bottom: 10px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .soluk { color: #5b6b78; }
  .durum { background: #f1f5f9; border-radius: 12px; padding: 12px; margin: 16px 0; line-height: 1.7; }
  .durum b { font-size: 20px; }
  button { display: block; width: 100%; border: 0; border-radius: 999px; padding: 18px; font: 800 24px system-ui; color: #fff; cursor: pointer; margin-top: 10px; letter-spacing: .5px; }
  button:disabled { opacity: .5; }
  .geldim { background: #1a7f37; }
  .ciktim { background: #b42318; }
  .uyari { background: #fff1f1; color: #b42318; border-radius: 10px; padding: 10px; margin-top: 12px; }
  .tamam { background: #e7f6ec; color: #11602a; border-radius: 10px; padding: 10px; margin-top: 12px; font-weight: 600; }
  a { color: #0067a4; display: inline-block; margin-top: 16px; }
</style>
</head>
<body>
  <main class="kart">
    <img src="/img/aysu-logo.svg" alt="Aysu Halı Saha">
    <div id="ic"><p class="soluk">Yükleniyor…</p></div>
    <a href="/panel/">Panele git</a>
  </main>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const t = q.get("t");
  const ic = document.getElementById("ic");
  const kacis = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let mesaj = "";

  function ciz(v) {
    if (v.hata) { ic.innerHTML = `<h1>Geldim / Çıktım</h1><div class="uyari">${kacis(v.hata)}</div>`; return; }
    const tarih = v.gun.split("-").reverse().join(".");
    let dugme = "";
    if (!v.giris) dugme = '<button class="geldim" type="button" data-i="geldim">GELDİM</button>';
    else if (!v.cikis) dugme = '<button class="ciktim" type="button" data-i="ciktim">ÇIKTIM</button>';
    ic.innerHTML = `<h1>Merhaba ${kacis(v.ben.ad)}</h1>
      <p class="soluk">${kacis(v.gunAd)} ${tarih}${v.baslama ? ` · beklenen giriş <b>${v.baslama}</b>` : ""}</p>
      <div class="durum">Geldim: <b>${v.giris || "—"}</b><br>Çıktım: <b>${v.cikis || "—"}</b>${v.cikis ? `<br>Çalışılan: <b>${String(v.saat).replace(".", ",")} saat</b>` : ""}</div>
      ${dugme}${mesaj}`;
    ic.querySelector("[data-i]")?.addEventListener("click", async (e) => {
      const islem = e.target.dataset.i;
      if (!confirm(islem === "geldim" ? "Sahaya geldiğinizi şimdi onaylıyor musunuz?" : "İşten çıktığınızı şimdi onaylıyor musunuz?")) return;
      e.target.disabled = true;
      const r = await fetch("/api/puantaj", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ t, islem }) })
        .then((x) => x.json()).catch(() => ({ hata: "Sunucuya ulaşılamadı. Tekrar deneyin." }));
      if (r.hata) { e.target.disabled = false; mesaj = `<div class="uyari">${kacis(r.hata)}</div>`; return yukle(); }
      mesaj = `<div class="tamam">${islem === "geldim" ? `Girişiniz ${r.giris} olarak kaydedildi. Çıkarken aynı e-postadaki ÇIKTIM'a basın.` : `Çıkışınız ${r.cikis} olarak kaydedildi. İyi akşamlar!`}</div>`;
      ciz(r);
    });
  }

  async function yukle() {
    if (!t) return ciz({ hata: "Bağlantı eksik. E-postadaki düğmeyi kullanın ya da panelden giriş yapın." });
    const v = await fetch("/api/puantaj?t=" + encodeURIComponent(t), { cache: "no-store" }).then((x) => x.json()).catch(() => ({ hata: "Sunucuya ulaşılamadı." }));
    ciz(v);
  }
  yukle();
})();
</script>
</body>
</html>
